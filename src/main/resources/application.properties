spring.application.name=project-collaboration-platform
server.port=${PORT:8080}

# ---- MySQL (override with environment variables if you like) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/project_collab?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# 'update' lets Hibernate create/alter tables automatically.
# If you ran database/schema.sql yourself, you can change this to 'none'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- File uploads ----
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- JWT (secret must be at least 32 characters; change it in production) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-32chars-min}
app.jwt.expiration-ms=86400000
